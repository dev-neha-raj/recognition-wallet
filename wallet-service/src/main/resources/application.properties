spring.application.name=wallet-service

#Datasource (defaults match docker-compose; override via env in other environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recognition_wallet}
spring.datasource.username=${DB_USERNAME:wallet}
spring.datasource.password=${DB_PASSWORD:wallet}

#HikariCP pool(the knobs that most affect real DB performance)
spring.datasource.hikari.pool-name=wallet-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

#Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
