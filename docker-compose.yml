services:
  postgres:
    image: postgres:16
    container_name: recognition-wallet-postgres
    environment:
      POSTGRES_DB: recognition_wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - wallet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d recognition_wallet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wallet-pgdata: