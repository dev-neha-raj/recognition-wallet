services:
  postgres:
    image: postgres:16
    container_name: recognition-wallet-postgres
    environment:
      POSTGRES_DB: recognition_wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - wallet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d recognition_wallet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: recognition-wallet-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E -q 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 10

  apicurio:
    image: apicurio/apicurio-registry:3.0.6
    container_name: recognition-wallet-apicurio
    ports:
      - "8081:8080"

volumes:
  wallet-pgdata: